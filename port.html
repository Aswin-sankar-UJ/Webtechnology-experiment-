<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced CSS3 Webpage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- HEADER -->
        <header class="header">

            <div class="logo">
                <img src="C:\Users\Ash\OneDrive\Documents\header.jpg" alt="Flower">
            </div>

            <div class="title">
                <h1>My Webpage</h1>
                <p>Advanced CSS3 Web Design</p>
            </div>

        </header>


        <!-- NAVIGATION -->
        <nav class="navigation">

            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Myself</a>
            <a href="#">Others</a>

        </nav>


        <!-- MENU / ITEMS -->
        <section class="items-section">

            <h2>My Items</h2>

            <table class="item-table">

                <tr>
                    <td class="Flower1">Item 1</td>

                    <td class="itemImg">
                        <img src="C:\Users\Ash\OneDrive\Documents\item1.jpg" alt="Item 1">
                    </td>
                </tr>

                <tr>
                    <td class="Flower2">Item 2</td>

                    <td class="itemImg">
                        <img src="C:\Users\Ash\OneDrive\Documents\item2.jpg" alt="Item 2">
                    </td>
                </tr>

                <tr>
                    <td class="Flower3">Item 3</td>

                    <td class="itemImg">
                        <img src="C:\Users\Ash\OneDrive\Documents\item3.jpg" alt="Item 3">
                    </td>
                </tr>

                <tr>
                    <td class="Flower4">Item 4</td>

                    <td class="itemImg">
                        <img src="C:\Users\Ash\OneDrive\Documents\item4.jpg" alt="Item 4">
                    </td>
                </tr>

            </table>

        </section>


        <!-- LOGIN SECTION -->
        <main class="login-section">

            <!-- SIGN IN -->
            <div class="form-box">

                <h2>Sign In</h2>

                <form>

                    <label>Username</label>

                    <input
                        type="text"
                        placeholder="Enter Username / Email / Phone Number"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter Password"
                        required
                    >

                    <input
                        type="submit"
                        value="Sign In"
                        class="button"
                    >

                </form>

            </div>


            <!-- SIGN UP -->
            <div class="form-box">

                <h2>Sign Up</h2>

                <form>

                    <label>Name</label>

                    <input
                        type="text"
                        placeholder="Enter Name"
                        required
                    >

                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Enter Email"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter Password"
                        required
                    >

                    <input
                        type="submit"
                        value="Sign Up"
                        class="button"
                    >

                </form>

            </div>

        </main>


        <!-- FOOTER -->
        <footer>

            <p>Your Address</p>

            <p>
                 Web Technology Lab.
            </p>

        </footer>

    </div>

</body>

</html>
