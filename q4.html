<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
</head>
<body>

<h2>Currency Converter</h2>

<fieldset>
    Convert 
    <input type="text" id="data">

    <select id="from">
        <option>Indian Rupee</option>
        <option>US Dollar</option>
    </select>

    to

    <select id="to">
        <option>US Dollar</option>
        <option>Indian Rupee</option>
    </select>

    <button onclick="convert()">Calculate</button>
</fieldset>

<p>Answer: <span id="answer"></span></p>

<script>
function convert(){
    var value = parseFloat(document.getElementById("data").value);
    var from = document.getElementById("from").value;
    var to = document.getElementById("to").value;

    var result;

    if(from == "Indian Rupee" && to == "US Dollar")
        result = value * 0.015;
    else if(from == "US Dollar" && to == "Indian Rupee")
        result = value * 67.12;
    else
        result = value;

    document.getElementById("answer").innerHTML = result.toFixed(2);
}
</script>

</body>
</html>
