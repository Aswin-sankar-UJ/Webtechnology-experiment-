<!DOCTYPE html>
<html>
<head>
    <title>Fruit Farm</title>
</head>
<body>

<h2>Fruit Farm</h2>

Rows: <input type="text" id="rows"><br><br>
Columns: <input type="text" id="columns"><br><br>

<button onclick="grow()">Plant Garden</button>

<div id="garden"></div>

<script>
function grow(){
    var r = parseInt(document.getElementById("rows").value);
    var c = parseInt(document.getElementById("columns").value);

    var fruits = ["apple.jpg", "orange.jpg"];
    var garden = "";

    for(var i=0; i<r; i++){
        for(var j=0; j<c; j++){
            var rand = Math.floor(Math.random()*2);
            garden += "<img src='"+fruits[rand]+"' width='100' height='100'>";
        }
        garden += "<br>";
    }

    document.getElementById("garden").innerHTML = garden;
}
</script>

</body>
</html>
