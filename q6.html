<!DOCTYPE html>
<html>
<head>
    <title>Cake Order</title>
</head>
<body>

<h2>Pizza Order Form</h2>

<fieldset>
# of 1/2kg Cakes <input type="text" id="small"><br><br>
# of 1kg Cakes <input type="text" id="medium"><br><br>
# of 2kg Cakes <input type="text" id="large"><br><br>

Tip:
<label><input type="radio" name="tip" value="10">10%</label>
<label><input type="radio" name="tip" value="15" checked>15%</label>
<label><input type="radio" name="tip" value="20">20%</label><br><br>

<button id="submit">Calculate Order</button>
</fieldset>

<p>Cost of order: <span id="price"></span></p>

<script>
document.getElementById("submit").addEventListener("click", calculate);

function calculate(){
    var s = parseInt(document.getElementById("small").value);
    var m = parseInt(document.getElementById("medium").value);
    var l = parseInt(document.getElementById("large").value);

    var total = (s*100) + (m*200) + (l*400);

    total = total + (total * 0.09); // tax 9%

    var tip = document.querySelector('input[name="tip"]:checked').value;
    total = total + (total * tip/100);

    document.getElementById("price").innerHTML = total.toFixed(2);
}
</script>

</body>
</html>
